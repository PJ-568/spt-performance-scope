name: 测试

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # 纯逻辑层无游戏依赖，可在 CI 直接测试
      - name: 运行单元测试
        run: dotnet test tests/PerformanceScope.Tests/PerformanceScope.Tests.csproj -c Release
